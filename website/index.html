<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBrowse 2 Embedded</title>

    <!-- Load React (Required for JBrowse) -->
    <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>

    <!-- Load JBrowse 2 -->
    <script src="https://unpkg.com/@jbrowse/react-linear-genome-view/dist/react-linear-genome-view.umd.development.js" crossorigin></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #jbrowse_linear_genome_view {
            width: 80%;
            height: 500px;
            margin: auto;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>JBrowse 2 Embedded in a Simple Web Page</h1>
    <div id="jbrowse_linear_genome_view"></div>

    <script>
        window.onload = async function() {
          const { createViewState, JBrowseLinearGenomeView } = JBrowseReactLinearGenomeView;
      
          try {
            const response = await fetch("config.json");
            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
      
            const configData = await response.json();
            console.log("Loaded JBrowse config:", configData);
      
            if (!configData.assemblies || configData.assemblies.length === 0) {
              throw new Error("❌ No assemblies found in config.json!");
            }
            console.log("✅ Assemblies loaded:", configData.assemblies);
      
            if (!configData.tracks || configData.tracks.length === 0) {
              throw new Error("❌ No tracks found in config.json!");
            }
            console.log("✅ Tracks found:", configData.tracks.length);
      
            // ✅ Instead of using just config.json, manually pass assemblies & tracks
            const viewState = createViewState({
              assembly: configData.assemblies[0],  // Use first assembly as default
              tracks: configData.tracks,  // Load all tracks
              location: "1:1-1000000"  // Start at a default region
            });
      
            ReactDOM.render(
              React.createElement(JBrowseLinearGenomeView, { viewState }),
              document.getElementById("jbrowse_linear_genome_view")
            );
      
          } catch (error) {
            console.error("🚨 Error loading config.json:", error);
          }
        }
      </script>
      
      
      
</body>
</html>
