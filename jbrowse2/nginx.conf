server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Serve all genomic data under `/data/`
    location /data/ {
        autoindex on;
        root /usr/share/nginx/html;
    }

    error_page 404 /404.html;
}
