<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBrowse Track Form</title>
</head>
<body>
    <h1>Submit New Track</h1>
    <form>
        <label for="track_name">Track Name:</label>
        <input type="text" id="track_name" name="track_name" required>
        <br>
        <label for="file_location">File Location:</label>
        <input type="text" id="file_location" name="file_location" required>
        <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
